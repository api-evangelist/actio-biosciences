name: Actio Biosciences
description: Actio Biosciences is a San Diego-based clinical-stage biotechnology company developing
  precision medicines that translate insights from Mendelian (single-gene) genetics into treatments
  for both rare and common diseases. Its pipeline targets genetically defined conditions including
  KCNT1-related epilepsy and TRPV4-related Charcot-Marie-Tooth disease type 2C (CMT2C), following a
  strategy of expanding from rare indications into more prevalent diseases that share the same
  underlying biology. The company is backed by Canaan Partners. Actio publishes no developer or API
  surface; this profile captures its public identity and corporate web properties.
